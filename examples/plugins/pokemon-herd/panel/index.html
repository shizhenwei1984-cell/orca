<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon Herd</title>
    <link rel="stylesheet" href="./herd.css" />
  </head>
  <body>
    <header>
      <h1 id="workspace">Pokémon Herd</h1>
      <span id="count"></span>
    </header>
    <section id="trainer" aria-label="Trainer" hidden>
      <strong id="wallet"></strong>
      <span id="work"></span>
      <span id="candy" hidden></span>
      <button type="button" id="open-trainer">Trainer</button>
    </section>
    <p role="status" id="progress-error" hidden></p>
    <p role="status" id="message">Loading agents…</p>
    <button id="retry" hidden>Retry</button>
    <ul id="herd" aria-label="Agent Pokémon"></ul>
    <dialog id="trainer-game" aria-labelledby="trainer-game-title">
      <header>
        <h2 id="trainer-game-title">Trainer</h2>
        <strong id="trainer-game-wallet"></strong>
        <button type="button" id="close-trainer">Close</button>
      </header>
      <nav id="trainer-tabs" aria-label="Trainer pages"></nav>
      <div id="trainer-view"></div>
      <footer>
        <span role="status" id="trainer-feedback"></span>
        <button type="button" id="trainer-action-retry" hidden>Retry action</button>
      </footer>
    </dialog>
    <template id="companion">
      <li>
        <div class="field" aria-hidden="true">
          <div class="trail"><div class="sprite"></div></div>
        </div>
        <div class="caption">
          <div class="identity"><strong></strong><small></small></div>
          <span class="state"></span>
        </div>
        <div class="progress" hidden>
          <span class="career"></span>
          <span class="growth"></span>
          <button type="button" class="care">Care</button>
        </div>
      </li>
    </template>
    <script type="module" src="./herd.js"></script>
  </body>
</html>
